apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shared-pitr
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:yinkaolotin/homelab.git
    targetRevision: main
    path: infra/storage/postgres/shared-pitr
  destination:
    server: https://kubernetes.default.svc
    namespace: shared-pitr
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
