credentials:
  useSecret: true
  secretContents:
    cloud: |
      [default]
      aws_access_key_id=admin
      aws_secret_access_key=yinkaolotin

configuration:
  backupStorageLocation:
    - name: default
      provider: aws
      bucket: velero-backups
      default: true
      config:
        region: minio
        s3ForcePathStyle: "true"
        s3Url: http://minio.minio.svc.cluster.local:9000
        publicUrl: http://127.0.0.1:9000

  volumeSnapshotLocation:
    - name: default
      provider: aws
      config:
        region: minio

  uploaderType: kopia
  defaultVolumesToFsBackup: true

initContainers:
  - name: velero-plugin-for-aws
    image: velero/velero-plugin-for-aws:v1.12.2
    volumeMounts:
      - mountPath: /target
        name: plugins

deployNodeAgent: true

nodeAgent:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi
