apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: minio-store
  namespace: shared-pitr
spec:
  configuration:
    destinationPath: s3://cnpg-backups/shared-postgres-dev
    endpointURL: http://minio.minio.svc.cluster.local:9000

    s3Credentials:
      accessKeyId:
        name: minio-pitr-creds
        key: ACCESS_KEY_ID

      secretAccessKey:
        name: minio-pitr-creds
        key: ACCESS_SECRET_KEY

    wal:
      compression: gzip

    data:
      compression: gzip
